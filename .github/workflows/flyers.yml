name: flyers

# 매일 두 번 새 전단을 확인한다. 새 전단이 있을 때만 Claude(구독 토큰 CLAUDE_SETUP_TOKEN)가 이미지를 읽고,
# config/criteria.json 기준에 맞는 품목과 1+1 을 텔레그램으로 보낸다. 새 전단이 없으면 Claude 단계를 건너뛰므로 구독 사용량을 쓰지 않는다.
#   1) scripts/fetch_flyers.py : 카카오톡 채널(이마트 평촌점 채널과 전국 공통 전단을 올리는 지점 채널들, 롯데마트 지점 채널들,
#                               킴스클럽)에서 새 전단을 찾아 이미지를 내려받고 나눈다. 로그인해야 볼 수 있는 킴스클럽 전단 글은 안내만 만든다
#   2) Claude 전단 판독 1~5    : 전단마다 세션을 따로 열어 Read 도구 하나만 쓰고, 품목을 구조화된 출력(JSON)으로만 돌려준다
#                               (prompts/extract.md, prompts/schema.json). 조각이 30개를 넘는 전단은 두 세션에 나눠 읽는다
#   3) scripts/evaluate.py     : 기준 판정 → 메시지 작성, 처리한 전단을 state/seen.json 에 표시, 품목 기록을 state/history 에 남긴다
#   4) cards/render.py         : 판정 결과로 1080x1350 카드 이미지(요약·1+1 목록·⭐ 품목이 실린 전단 원본)를 만든다
#   5) cards/render.py --compare : 목요일 저녁(못 보내면 그 주 일요일까지)에 세 매장 비교 카드를 만든다
#   6) scripts/check_missing.py : 금요일 저녁(그 주 일요일까지)에도 이번 주 이마트·롯데마트 전단을 찾지 못했으면 안내를 만든다
#   7) scripts/notify_telegram.py : 매장마다 앨범(설명 글 포함)을 보내고 이어서 텍스트 메시지·안내를 보낸다 → 상태 커밋
# 카드 단계가 실패해도 텍스트 메시지는 그대로 보낸다.
# Claude 단계가 실패하면 그 전단은 표시하지 않아 다음 실행이 다시 읽는다. 같은 전단을 두 번 실패하면 '직접 확인' 메시지를 보내고 넘어간다.
on:
  schedule:
    # 정각·30분은 GitHub 예약 실행이 몰려 몇 시간씩 늦게 시작했다(08:30 → 13시 무렵, 18:30 → 새벽 3시 무렵).
    # 몰리는 시각을 피해 07:43·17:43 으로 둔다.
    - cron: "43 7 * * *"      # 매일 07:43 KST
      timezone: "Asia/Seoul"
    - cron: "43 17 * * *"     # 매일 17:43 KST
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force:
        description: "이미 처리한 전단도 다시 읽을 매장 id(쉼표로 구분: emart_pyeongchon, lotte_uiwang, kims_pyeongchon) 또는 all"
        type: string
        default: ""
      dry_run:
        description: "텔레그램으로 보내지 않고 실행 요약(Summary)에만 남긴다. 상태도 저장하지 않는다"
        type: boolean
        default: false
      compare:
        description: "요일과 이번 주 발송 여부에 상관없이 매장 비교 카드를 만들어 보낸다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flyers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 준비
        run: |
          pip install --quiet pillow jinja2 playwright
          # 카드는 러너에 깔린 Google Chrome 으로 찍는다. 없으면 Playwright 의 Chromium 을 받는다
          command -v google-chrome >/dev/null || python -m playwright install --with-deps chromium

      - name: 새 전단 확인·이미지 준비
        id: fetch
        env:
          FORCE: ${{ inputs.force }}
          HAS_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN != '' }}
          HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          # 비밀값이 없을 때 돌면 판독 실패가 쌓이거나 보내지 못한 전단이 처리된 것으로 표시되므로, 아무것도 하지 않고 넘어간다
          if [ "$HAS_TOKEN" != "true" ] || { [ "$HAS_TG" != "true" ] && [ -z "$DRY_RUN" ]; }; then
            echo "::warning::CLAUDE_SETUP_TOKEN / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set; skipping this run"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/fetch_flyers.py --force "$FORCE"
          echo "schema=$(python -c 'import json;print(json.dumps(json.load(open("prompts/schema.json")),ensure_ascii=False,separators=(",",":")))')" >> "$GITHUB_OUTPUT"

      # 전단마다 Claude 세션을 따로 쓴다(scripts/fetch_flyers.py 의 BATCH_CHUNKS·MAX_BATCHES).
      # 모델은 Opus 5.5, 추론 강도(effort)는 xhigh 가 기본이다. 저장소 변수 CLAUDE_MODEL·CLAUDE_EFFORT 로 바꿀 수 있다.
      # 한 세션에서 이미지를 많이 읽으면 먼저 읽은 이미지가 대화에서 비워져 그 전단을 읽지 못한다.
      - name: Claude 전단 판독 1
        id: claude1
        if: steps.fetch.outputs.new == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "작업 지시는 ${{ github.workspace }}/prompts/extract.md 에 있습니다. Read 도구로 그 파일을 먼저 읽고, 지시대로 ${{ github.workspace }}/work/batch_1.json 의 전단 이미지를 모두 읽은 뒤 구조화된 출력으로 답하세요."
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'xhigh' }}
            --max-turns 150
            --tools Read
            --allowedTools Read
            --strict-mcp-config
            --setting-sources user
            --json-schema '${{ steps.fetch.outputs.schema }}'

      - name: Claude 전단 판독 2
        id: claude2
        if: fromJSON(steps.fetch.outputs.batches || '0') >= 2
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "작업 지시는 ${{ github.workspace }}/prompts/extract.md 에 있습니다. Read 도구로 그 파일을 먼저 읽고, 지시대로 ${{ github.workspace }}/work/batch_2.json 의 전단 이미지를 모두 읽은 뒤 구조화된 출력으로 답하세요."
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'xhigh' }}
            --max-turns 150
            --tools Read
            --allowedTools Read
            --strict-mcp-config
            --setting-sources user
            --json-schema '${{ steps.fetch.outputs.schema }}'

      - name: Claude 전단 판독 3
        id: claude3
        if: fromJSON(steps.fetch.outputs.batches || '0') >= 3
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "작업 지시는 ${{ github.workspace }}/prompts/extract.md 에 있습니다. Read 도구로 그 파일을 먼저 읽고, 지시대로 ${{ github.workspace }}/work/batch_3.json 의 전단 이미지를 모두 읽은 뒤 구조화된 출력으로 답하세요."
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'xhigh' }}
            --max-turns 150
            --tools Read
            --allowedTools Read
            --strict-mcp-config
            --setting-sources user
            --json-schema '${{ steps.fetch.outputs.schema }}'

      - name: Claude 전단 판독 4
        id: claude4
        if: fromJSON(steps.fetch.outputs.batches || '0') >= 4
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "작업 지시는 ${{ github.workspace }}/prompts/extract.md 에 있습니다. Read 도구로 그 파일을 먼저 읽고, 지시대로 ${{ github.workspace }}/work/batch_4.json 의 전단 이미지를 모두 읽은 뒤 구조화된 출력으로 답하세요."
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'xhigh' }}
            --max-turns 150
            --tools Read
            --allowedTools Read
            --strict-mcp-config
            --setting-sources user
            --json-schema '${{ steps.fetch.outputs.schema }}'

      - name: Claude 전단 판독 5
        id: claude5
        if: fromJSON(steps.fetch.outputs.batches || '0') >= 5
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "작업 지시는 ${{ github.workspace }}/prompts/extract.md 에 있습니다. Read 도구로 그 파일을 먼저 읽고, 지시대로 ${{ github.workspace }}/work/batch_5.json 의 전단 이미지를 모두 읽은 뒤 구조화된 출력으로 답하세요."
          classify_inline_comments: "false"
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --effort ${{ vars.CLAUDE_EFFORT || 'xhigh' }}
            --max-turns 150
            --tools Read
            --allowedTools Read
            --strict-mcp-config
            --setting-sources user
            --json-schema '${{ steps.fetch.outputs.schema }}'

      - name: 기준 판정·메시지 작성
        if: steps.fetch.outputs.new == 'true'
        env:
          CLAUDE_OUT_1: ${{ steps.claude1.outputs.structured_output }}
          CLAUDE_CONCLUSION_1: ${{ steps.claude1.outcome }}
          CLAUDE_OUT_2: ${{ steps.claude2.outputs.structured_output }}
          CLAUDE_CONCLUSION_2: ${{ steps.claude2.outcome }}
          CLAUDE_OUT_3: ${{ steps.claude3.outputs.structured_output }}
          CLAUDE_CONCLUSION_3: ${{ steps.claude3.outcome }}
          CLAUDE_OUT_4: ${{ steps.claude4.outputs.structured_output }}
          CLAUDE_CONCLUSION_4: ${{ steps.claude4.outcome }}
          CLAUDE_OUT_5: ${{ steps.claude5.outputs.structured_output }}
          CLAUDE_CONCLUSION_5: ${{ steps.claude5.outcome }}
          NO_STATE: ${{ inputs.dry_run == true && '--no-state' || '' }}
        run: python scripts/evaluate.py $NO_STATE

      - name: 카드 이미지 만들기
        id: cards
        if: steps.fetch.outputs.new == 'true'
        continue-on-error: true
        run: python cards/render.py

      - name: 매장 비교 카드
        id: compare
        continue-on-error: true
        env:
          HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          FORCE_COMPARE: ${{ inputs.compare == true && '--force' || '' }}
        run: |
          if [ "$HAS_TG" != "true" ] && [ -z "$DRY_RUN" ]; then
            echo "TELEGRAM secrets not set; skipping compare card"
            exit 0
          fi
          python cards/render.py --compare $FORCE_COMPARE

      - name: 전단 미발견 확인
        id: missing
        continue-on-error: true
        env:
          HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          if [ "$HAS_TG" != "true" ] && [ -z "$DRY_RUN" ]; then
            echo "TELEGRAM secrets not set; skipping missing check"
            exit 0
          fi
          python scripts/check_missing.py

      - name: 텔레그램 발송
        if: steps.fetch.outputs.new == 'true' || steps.fetch.outputs.restricted == 'true' || steps.compare.outputs.ready == 'true' || steps.missing.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python scripts/notify_telegram.py

      - name: 카드 이미지 보관(7일)
        if: steps.cards.outcome == 'success' || steps.compare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: work/cards/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 상태 커밋
        if: (steps.fetch.outputs.new == 'true' || steps.fetch.outputs.restricted == 'true' || steps.compare.outputs.ready == 'true' || steps.missing.outputs.ready == 'true') && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "flyers $(TZ=Asia/Seoul date +%F)"
            git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
          fi
